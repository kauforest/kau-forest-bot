<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>غابة الطب — لوحة المتصدرين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #143550;
    --panel: #1d4763;
    --panel-alt: #285d80;
    --text: #fffaf0;
    --text-dim: #c3ddf0;
    --accent: #ffc65c;
    --accent-glow: rgba(255, 198, 92, 0.55);
    --accent-2: #3eeeb8;
    --accent-3: #6cc0ff;
    --accent-3-glow: rgba(108, 192, 255, 0.5);
    --line: rgba(255, 250, 240, 0.16);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    min-height: 100%;
  }

  body {
    padding: 32px 20px 60px;
    font-variant-numeric: tabular-nums;
    position: relative;
    overflow-x: hidden;
    background:
      radial-gradient(ellipse 65% 45% at 15% 0%, rgba(255,198,92,0.22), transparent 62%),
      radial-gradient(ellipse 80% 55% at 95% 8%, rgba(108,192,255,0.24), transparent 64%),
      radial-gradient(ellipse 85% 55% at 50% 100%, rgba(62,238,184,0.18), transparent 66%),
      var(--bg);
  }

  .fireflies {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }

  .firefly {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px 2px var(--accent-glow);
    opacity: 0;
  }

  @media (prefers-reduced-motion: no-preference) {
    .firefly { animation: drift 9s ease-in-out infinite; }
  }

  @keyframes drift {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    15% { opacity: 0.9; }
    50% { transform: translateY(-40px) translateX(10px); opacity: 0.5; }
    85% { opacity: 0.8; }
    100% { transform: translateY(-90px) translateX(-6px); opacity: 0; }
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .leader-banner {
    text-align: center;
    font-size: 0.85rem;
    color: var(--accent);
    background: linear-gradient(135deg, rgba(255,198,92,0.14), rgba(108,192,255,0.10));
    border: 1px solid rgba(255,198,92,0.3);
    border-radius: 999px;
    padding: 6px 16px;
    display: block;
    margin: 0 auto 22px;
    width: fit-content;
    max-width: 92%;
  }

  /* The daily-top banner holds 3 names + medals, not one short line —
     a full pill shape reads as cramped at that length. A softer-cornered
     card, with each entry able to wrap onto its own visual unit, reads
     much more cleanly at this length. */
  .daily-top-banner {
    text-align: center;
    font-size: 0.85rem;
    color: var(--accent);
    background: linear-gradient(135deg, rgba(255,198,92,0.14), rgba(108,192,255,0.10));
    border: 1px solid rgba(255,198,92,0.3);
    border-radius: 14px;
    padding: 10px 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 6px 14px;
    margin: 0 auto 22px;
    width: fit-content;
    max-width: 92%;
  }
  .daily-top-banner .dtb-title {
    width: 100%;
    font-weight: bold;
    margin-bottom: 2px;
  }
  .daily-top-banner .dtb-entry {
    white-space: nowrap;
  }

  .kicker {
    text-align: center;
    color: var(--accent-3);
    font-size: 0.68rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin: 0 0 6px;
    opacity: 0.85;
  }

  .site-title {
    font-family: 'Lalezar', 'Tajawal', sans-serif;
    font-size: 2.1rem;
    background: linear-gradient(90deg, var(--accent-2), var(--accent) 55%, var(--accent-3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-align: center;
    letter-spacing: 0.5px;
    margin: 0 0 6px;
    line-height: 1.15;
  }

  .site-sub {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.88rem;
    margin: 0 0 30px;
  }

  .hero {
    text-align: center;
    margin-bottom: 8px;
  }

  .hero-number {
    font-family: 'Lalezar', sans-serif;
    font-size: 4.6rem;
    color: var(--accent);
    line-height: 1;
    margin: 0;
    text-shadow: 0 0 30px var(--accent-glow), 0 0 60px rgba(255,198,92,0.25);
    letter-spacing: 1px;
  }

  .hero-label {
    color: var(--text-dim);
    font-size: 0.95rem;
    margin-top: 6px;
  }

  .canopy {
    display: block;
    width: 100%;
    height: 40px;
    margin: 10px 0 30px;
    opacity: 0.9;
  }

  .forest-canvas {
    margin: 26px 0 4px;
  }

  .forest-canvas svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .tree-label {
    font-family: 'Tajawal', sans-serif;
    font-size: 9px;
    fill: var(--text-dim);
  }

  @media (prefers-reduced-motion: no-preference) {
    .tree-group { animation: grow 0.7s ease-out backwards; }
  }

  @keyframes grow {
    from { transform: scaleY(0.4); opacity: 0; }
    to { transform: scaleY(1); opacity: 1; }
  }

  .spotlight {
    text-align: center;
    color: var(--accent-2);
    font-size: 0.88rem;
    margin: 0 0 4px;
  }

  .tabs, .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 14px;
  }

  .pill {
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.02);
    color: var(--text-dim);
    font-family: 'Tajawal', sans-serif;
    font-weight: 500;
    font-size: 0.9rem;
    padding: 7px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, transform 0.12s ease;
  }

  .pill:hover { border-color: var(--accent-2); color: var(--text); transform: translateY(-1px); }

  .pill.active {
    background: linear-gradient(135deg, rgba(255,198,92,0.24), rgba(62,238,184,0.18));
    border-color: var(--accent);
    color: var(--text);
    box-shadow: 0 0 18px rgba(255,198,92,0.28);
  }

  .chips { margin-bottom: 26px; }

  .list {
    border-top: 1px solid var(--line);
  }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 10px;
    border-bottom: 1px solid var(--line);
    border-radius: 10px;
    transition: background 0.15s ease;
    position: relative;
  }

  .row:hover { background: rgba(255,255,255,0.025); }

  .row:nth-child(1) {
    border-right: 3px solid var(--accent);
    background: linear-gradient(90deg, rgba(255,198,92,0.10), transparent 70%);
  }
  .row:nth-child(2) { border-right: 3px solid var(--accent-2); }
  .row:nth-child(3) { border-right: 3px solid var(--accent-3); }

  @media (prefers-reduced-motion: no-preference) {
    .row { animation: rowIn 0.45s ease-out backwards; }
    .row:nth-child(1) { animation-delay: 0.05s; }
    .row:nth-child(2) { animation-delay: 0.10s; }
    .row:nth-child(3) { animation-delay: 0.15s; }
    .row:nth-child(4) { animation-delay: 0.20s; }
    .row:nth-child(5) { animation-delay: 0.25s; }
    .row:nth-child(6) { animation-delay: 0.30s; }
    .row:nth-child(7) { animation-delay: 0.35s; }
    .row:nth-child(8) { animation-delay: 0.40s; }
  }

  @keyframes rowIn {
    from { opacity: 0; transform: translateX(8px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .crown {
    display: inline-block;
  }

  @media (prefers-reduced-motion: no-preference) {
    .crown { animation: crownBounce 1.8s ease-in-out infinite; }
  }

  @keyframes crownBounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-3px) rotate(-4deg); }
  }

  .rank-glyph {
    width: 28px;
    text-align: center;
    font-size: 1.15rem;
    flex-shrink: 0;
  }

  .rank-num {
    width: 28px;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.95rem;
    flex-shrink: 0;
  }

  .row-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .row-name {
    font-size: 1rem;
  }

  .row-level {
    font-size: 0.74rem;
    color: var(--accent-3);
  }

  .row-batch {
    font-size: 0.78rem;
    color: var(--text-dim);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 2px 7px;
    margin-inline-start: 6px;
  }

  .row-minutes {
    font-weight: 700;
    color: var(--accent-2);
    font-size: 0.98rem;
    flex-shrink: 0;
  }

  .empty {
    text-align: center;
    color: var(--text-dim);
    padding: 40px 10px;
    font-size: 0.95rem;
  }

  .founder-badge {
    font-size: 0.72rem;
    color: #0a1e2e;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    padding: 1px 7px;
    border-radius: 999px;
    margin-inline-start: 5px;
    font-weight: 700;
  }

  .banner {
    background: var(--panel-alt);
    border: 1px solid var(--accent);
    color: var(--accent);
    text-align: center;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.9rem;
    margin-bottom: 20px;
  }

  .section {
    margin-top: 34px;
    border-top: 1px solid var(--line);
    padding-top: 20px;
  }

  .section-title {
    font-family: 'Lalezar', sans-serif;
    font-size: 1.15rem;
    color: var(--accent-2);
    margin: 0 0 14px;
    text-align: center;
    letter-spacing: 0.3px;
  }

  .hof-row {
    display: flex;
    justify-content: space-between;
    padding: 9px 4px;
    border-bottom: 1px solid var(--line);
    font-size: 0.92rem;
  }

  .hof-week {
    color: var(--text-dim);
    font-size: 0.8rem;
  }

  .streak-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 4px;
    border-bottom: 1px solid var(--line);
  }

  .streak-name { font-size: 0.94rem; }
  .streak-name .row-batch { margin-inline-start: 6px; }

  .streak-flames {
    color: var(--accent);
    font-size: 0.95rem;
    text-shadow: 0 0 10px var(--accent-glow);
    white-space: nowrap;
  }

  @media (prefers-reduced-motion: no-preference) {
    .streak-flames { animation: flicker 1.6s ease-in-out infinite; }
  }

  @keyframes flicker {
    0%, 100% { text-shadow: 0 0 10px var(--accent-glow); opacity: 1; }
    50% { text-shadow: 0 0 18px var(--accent-glow), 0 0 26px rgba(255,198,92,0.3); opacity: 0.85; }
  }

  .war-row {
    padding: 12px 2px;
  }

  .war-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }

  .war-name { font-size: 0.97rem; font-weight: 700; }

  .war-stats {
    font-size: 0.78rem;
    color: var(--text-dim);
    text-align: left;
  }

  .war-stats b { color: var(--accent); font-size: 0.95rem; }

  .war-bar-track {
    height: 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    overflow: hidden;
  }

  .war-bar-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    transition: width 0.6s ease;
  }

  .last-place {
    text-align: center;
    color: var(--accent);
    font-size: 0.85rem;
    margin-top: 14px;
  }

  .updated {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.78rem;
    margin-top: 30px;
  }

  @media (prefers-reduced-motion: no-preference) {
    .updated.live-flash { animation: liveFlash 1s ease-out; }
  }

  @keyframes liveFlash {
    0% { color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }
    100% { color: var(--text-dim); text-shadow: none; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .hero-number { animation: rise 0.6s ease-out; }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .ma-toggle-wrap {
    text-align: center;
    margin-bottom: 22px;
  }

  .ma-search {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }

  .ma-input {
    flex: 1;
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    font-size: 0.95rem;
    padding: 10px 14px;
    border-radius: 999px;
    outline: none;
  }

  .ma-input::placeholder { color: var(--text-dim); }
  .ma-input:focus { border-color: var(--accent-3); box-shadow: 0 0 0 2px var(--accent-3-glow); }

  .ma-submit {
    border: none;
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    color: #0a1e2e;
    font-family: 'Tajawal', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    padding: 0 20px;
    border-radius: 999px;
    cursor: pointer;
    flex-shrink: 0;
  }

  .ma-name {
    text-align: center;
    font-size: 1.05rem;
    font-weight: 700;
    margin: 4px 0 16px;
  }

  .ma-chart {
    margin: 0 0 4px;
  }

  .ma-chart svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .ma-chart-caption {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.78rem;
    margin: 0 0 18px;
  }

  .ma-stat {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 11px 4px;
    border-bottom: 1px solid var(--line);
    font-size: 0.92rem;
  }

  .ma-stat span { color: var(--text-dim); }
  .ma-stat b { color: var(--accent-2); font-size: 0.95rem; white-space: nowrap; }

  .ma-heat-wrap {
    overflow-x: auto;
    padding: 2px 0 10px;
  }

  .ma-heat-grid {
    display: flex;
    gap: 3px;
    direction: ltr; /* weeks always flow oldest -> newest, left to right,
      regardless of page direction — the recognizable GitHub-heatmap
      reading convention, kept consistent rather than mirrored */
    width: max-content;
  }

  .ma-heat-col {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .ma-heat-cell {
    width: 11px;
    height: 11px;
    border-radius: 3px;
    background: var(--accent-2);
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="fireflies" id="fireflies"></div>
  <div class="wrap">
    <p class="kicker">KAU · MEDICINE</p>
    <p class="site-title">🌲 غابة الطب</p>
    <p class="site-sub">منافسة ساعات المذاكرة بين دفعات كلية الطب</p>

    <p class="leader-banner" id="leaderBanner" style="display:none"></p>
    <div class="daily-top-banner" id="dailyTopBanner" style="display:none"></div>

    <div class="hero">
      <p class="hero-number" id="heroNumber">—</p>
      <p class="hero-label">إجمالي ساعات التركيز الجماعية منذ البداية</p>
    </div>

    <div class="forest-canvas" id="forestCanvas" aria-label="أعلى المتصدرين هذا الأسبوع، كل شخص شجرة">
      <svg id="forestSvg" viewBox="0 0 640 180" preserveAspectRatio="xMidYMax meet"></svg>
    </div>

    <svg class="canopy" viewBox="0 0 600 40" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 40 Q 30 10 60 30 T 120 25 T 180 32 T 240 18 T 300 30 T 360 22 T 420 32 T 480 20 T 540 30 T 600 24 V40 Z" fill="#24402f"/>
      <path d="M0 40 Q 40 25 80 35 T 160 32 T 240 30 T 320 34 T 400 28 T 480 34 T 560 30 T 600 32 V40 Z" fill="#1b2f24"/>
    </svg>

    <p class="spotlight" id="improvedSpotlight" style="display:none"></p>

    <div class="banner" id="examBanner" style="display:none">
      📚 وضع الاختبارات مفعّل — الأولوية للمذاكرة، لا للترتيب
    </div>

    <div class="ma-toggle-wrap">
      <button class="pill" id="maToggleBtn">📊 تحليلاتي</button>
    </div>

    <div class="section" id="myAnalyticsSection" style="display:none">
      <p class="section-title">📊 تحليلاتي</p>
      <div class="ma-search">
        <input type="text" id="maUsernameInput" class="ma-input" dir="ltr" placeholder="@يوزرك_بتيليجرام" maxlength="64">
        <button class="ma-submit" id="maSubmitBtn">عرض</button>
      </div>
      <div id="maResult"></div>
    </div>

    <div class="tabs" id="tabs">
      <button class="pill" data-period="daily">اليوم</button>
      <button class="pill active" data-period="weekly">الأسبوع</button>
      <button class="pill" data-period="monthly">الشهر</button>
      <button class="pill" data-period="all_time">كل الوقت</button>
    </div>

    <div class="chips" id="chips"></div>

    <div class="list" id="list">
      <p class="empty">جاري التحميل...</p>
    </div>

    <div class="section" id="batchWarSection" style="display:none">
      <p class="section-title">⚔️ حرب الدفعات هذا الأسبوع</p>
      <div id="batchWarList"></div>
      <p class="last-place" id="lastPlaceNote"></p>
    </div>

    <div class="section" id="streakSection" style="display:none">
      <p class="section-title">🔥 سلسلة الالتزام</p>
      <div id="streakList"></div>
    </div>

    <div class="section" id="hofSection" style="display:none">
      <p class="section-title">🏛️ قاعة المشاهير — بطل كل أسبوع</p>
      <div id="hofList"></div>
    </div>

    <p class="updated" id="updated"></p>
  </div>

<script>
  let DATA = null;
  let currentPeriod = 'weekly';
  let currentBatch = 'الكل';

  (function initFireflies() {
    const container = document.getElementById('fireflies');
    const count = window.innerWidth < 500 ? 10 : 16;
    for (let i = 0; i < count; i++) {
      const f = document.createElement('div');
      f.className = 'firefly';
      f.style.left = Math.random() * 100 + '%';
      f.style.top = 30 + Math.random() * 65 + '%';
      f.style.animationDelay = (Math.random() * 9).toFixed(2) + 's';
      f.style.animationDuration = (7 + Math.random() * 5).toFixed(2) + 's';
      container.appendChild(f);
    }
  })();

  const rankGlyph = (i) => ['🌲', '🌳', '🌿'][i] || null;

  // Arabic number-noun agreement: 1 and 2 use their own word (no digit
  // shown), 3-10 use "N " + plural noun, 11+ falls back to "N " +
  // singular noun — e.g. "منذ دقيقة" (1), "منذ دقيقتين" (2),
  // "منذ 3 دقائق" (3-10), "منذ 15 دقيقة" (11+). A flat "N + singular"
  // for every count, like plain English pluralization, reads as a
  // grammar mistake in Arabic.
  function arabicCount(n, singular, dual, plural) {
    if (n === 1) return singular;
    if (n === 2) return dual;
    if (n >= 3 && n <= 10) return `${n} ${plural}`;
    return `${n} ${singular}`;
  }

  function timeAgo(iso) {
    if (!iso) return '';
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.round(diffMs / 60000);
    if (mins < 1) return 'الآن';
    if (mins < 60) return `منذ ${arabicCount(mins, 'دقيقة', 'دقيقتين', 'دقائق')}`;
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return `منذ ${arabicCount(hrs, 'ساعة', 'ساعتين', 'ساعات')}`;
    const days = Math.round(hrs / 24);
    return `منذ ${arabicCount(days, 'يوم', 'يومين', 'أيام')}`;
  }

  function renderDailyTopBanner() {
    const el = document.getElementById('dailyTopBanner');
    const top = (DATA.daily || []).slice(0, 3);
    if (!top.length) {
      el.style.display = 'none';
      return;
    }
    const medals = ['🥇', '🥈', '🥉'];
    el.style.display = 'flex';
    el.innerHTML =
      '<span class="dtb-title"><span class="crown">👑</span> أبطال اليوم</span>' +
      top.map((r, i) => `<span class="dtb-entry">${medals[i]} ${r.name}</span>`).join('');
  }

  function renderLeaderBanner() {
    const el = document.getElementById('leaderBanner');
    const totals = DATA.weekly_batch_totals || {};
    const names = Object.keys(totals);
    if (names.length < 2) {
      el.style.display = 'none';
      return;
    }
    const leader = names.sort((a, b) => (totals[b] || 0) - (totals[a] || 0))[0];
    el.style.display = 'block';
    el.innerHTML = `<span class="crown">👑</span> الدفعة القائدة هذا الأسبوع: <b>${leader}</b>`;
  }

  let heroAnimated = false;
  function animateHeroNumber(target) {
    const el = document.getElementById('heroNumber');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion || heroAnimated) {
      el.textContent = target.toLocaleString('en-US');
      heroAnimated = true;
      return;
    }
    heroAnimated = true;
    const duration = 1100;
    const start = performance.now();
    function tick(now) {
      const progress = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - progress, 3); // ease-out cubic
      el.textContent = Math.round(target * eased).toLocaleString('en-US');
      if (progress < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function renderForest() {
    const rows = (DATA.weekly || []).slice(0, 8);
    const svg = document.getElementById('forestSvg');
    if (!rows.length) {
      document.getElementById('forestCanvas').style.display = 'none';
      return;
    }
    document.getElementById('forestCanvas').style.display = 'block';
    const maxMinutes = Math.max(...rows.map(r => r.minutes), 1);
    const slotW = 640 / rows.length;
    const baseline = 165;
    const colors = ['#e3a83b', '#a3c9a8', '#7fb68c', '#5f9273'];

    let svgContent = '';
    rows.forEach((r, i) => {
      const scale = 0.45 + 0.55 * (r.minutes / maxMinutes); // never fully flat
      const h = 110 * scale;
      const trunkH = 18 * scale;
      const cx = slotW * i + slotW / 2;
      const canopyR = 22 * scale;
      const color = colors[i % colors.length];
      const delay = (i * 0.07).toFixed(2);

      svgContent += `
        <g class="tree-group" style="animation-delay:${delay}s; transform-origin: ${cx}px ${baseline}px;">
          <rect x="${cx - 3}" y="${baseline - trunkH}" width="6" height="${trunkH}" rx="2" fill="#5c4632"/>
          <circle cx="${cx}" cy="${baseline - trunkH - canopyR * 0.7}" r="${canopyR}" fill="${color}" opacity="0.95"/>
          <circle cx="${cx - canopyR * 0.5}" cy="${baseline - trunkH - canopyR * 0.3}" r="${canopyR * 0.7}" fill="${color}" opacity="0.85"/>
          <circle cx="${cx + canopyR * 0.5}" cy="${baseline - trunkH - canopyR * 0.3}" r="${canopyR * 0.7}" fill="${color}" opacity="0.85"/>
          <text x="${cx}" y="${baseline + 14}" text-anchor="middle" class="tree-label">${r.name.length > 8 ? r.name.slice(0, 7) + '…' : r.name}</text>
        </g>
      `;
    });
    svg.innerHTML = svgContent;
  }

  function renderStreaks() {
    const section = document.getElementById('streakSection');
    const streaks = DATA.top_streaks || [];
    if (!streaks.length) {
      section.style.display = 'none';
      return;
    }
    section.style.display = 'block';
    document.getElementById('streakList').innerHTML = streaks.map(s => {
      const flameCount = Math.min(5, Math.max(1, Math.ceil(s.streak / 7)));
      return `
        <div class="streak-row">
          <span class="streak-name">${s.name}${s.batch ? `<span class="row-batch">${s.batch}</span>` : ''}</span>
          <span class="streak-flames">${'🔥'.repeat(flameCount)} ${s.streak} يوم</span>
        </div>
      `;
    }).join('');
  }

  function renderSpotlight() {
    const el = document.getElementById('improvedSpotlight');
    const mi = DATA.most_improved;
    if (mi && mi.name && mi.delta > 0) {
      el.style.display = 'block';
      el.textContent = `📈 الأكثر تحسنًا هذا الأسبوع: ${mi.name} (+${mi.delta} دقيقة)`;
    } else {
      el.style.display = 'none';
    }
  }

  function render() {
    if (!DATA) return;
    renderLeaderBanner();
    renderDailyTopBanner();
    renderForest();
    renderSpotlight();
    renderStreaks();

    let rows;
    if (currentBatch === 'الكل') {
      rows = DATA[currentPeriod] || [];
    } else {
      rows = currentPeriod === 'weekly'
        ? (DATA.weekly_by_batch && DATA.weekly_by_batch[currentBatch]) || []
        : (rows = (DATA[currentPeriod] || []).filter(r => r.batch === currentBatch));
    }

    const listEl = document.getElementById('list');
    if (!rows.length) {
      listEl.innerHTML = '<p class="empty">لا توجد جلسات مسجّلة لهذه الفترة بعد.</p>';
    } else {
      listEl.innerHTML = rows.map((r, i) => `
        <div class="row">
          ${rankGlyph(i) ? `<span class="rank-glyph">${rankGlyph(i)}</span>` : `<span class="rank-num">${i + 1}</span>`}
          <div class="row-main">
            <span class="row-name">${i === 0 ? '<span class="crown">👑</span> ' : ''}${r.name}${r.founder ? '<span class="founder-badge">🏅 رائد</span>' : ''}${r.batch ? `<span class="row-batch">${r.batch}</span>` : ''}</span>
            ${r.level ? `<span class="row-level">Lv${r.level} · ${r.level_title || ''}</span>` : ''}
          </div>
          <span class="row-minutes">${r.xp != null ? r.xp + ' XP' : r.minutes + ' د'}</span>
        </div>
      `).join('');
    }

    const totalAllTime = (DATA.all_time || []).reduce((s, r) => s + r.minutes, 0);
    animateHeroNumber(Math.round(totalAllTime / 60));
    const liveTag = window.__liveConnected ? ' · 🟢 مباشر' : '';
    document.getElementById('updated').textContent = DATA.generated_at ? `آخر تحديث: ${timeAgo(DATA.generated_at)}${liveTag}` : '';

    document.getElementById('examBanner').style.display = DATA.exam_mode ? 'block' : 'none';

    const warSection = document.getElementById('batchWarSection');
    const totals = DATA.weekly_batch_totals || {};
    const averages = DATA.weekly_batch_averages || {};
    const batchNames = Object.keys(totals);
    if (batchNames.length > 1) {
      warSection.style.display = 'block';
      const ranked = batchNames.sort((a, b) => (totals[b] || 0) - (totals[a] || 0));
      const maxTotal = Math.max(...ranked.map(b => totals[b] || 0), 1);
      document.getElementById('batchWarList').innerHTML = ranked.map((b, i) => `
        <div class="war-row">
          <div class="war-top">
            <span class="war-name">${i === 0 ? '<span class="crown">👑</span> ' : ''}${b}</span>
            <span class="war-stats"><b>${totals[b] || 0} د</b> — ${averages[b] || 0} د/فرد</span>
          </div>
          <div class="war-bar-track"><div class="war-bar-fill" style="width:${Math.max(6, (totals[b] || 0) / maxTotal * 100)}%"></div></div>
        </div>
      `).join('');
      const lastBatch = ranked[ranked.length - 1];
      document.getElementById('lastPlaceNote').textContent =
        `⚠️ ${lastBatch} في آخر الترتيب — وقت تجيبون أصحابكم!`;
    } else {
      warSection.style.display = 'none';
    }

    const hofSection = document.getElementById('hofSection');
    const hof = DATA.hall_of_fame || [];
    if (hof.length) {
      hofSection.style.display = 'block';
      document.getElementById('hofList').innerHTML = hof.map(h => `
        <div class="hof-row">
          <span>🌲 ${h.name}${h.batch ? ` [${h.batch}]` : ''}</span>
          <span class="hof-week">${h.week_start} — ${h.minutes} د</span>
        </div>
      `).join('');
    } else {
      hofSection.style.display = 'none';
    }
  }

  function renderChips() {
    // Prefer the always-complete batch list from the backend so a batch
    // with zero sessions this week doesn't just vanish from the filter
    // entirely — fall back to weekly_by_batch's keys only for older
    // cached data that predates this field.
    const batches = DATA.all_batches || Object.keys(DATA.weekly_by_batch || {});
    const chipsEl = document.getElementById('chips');
    const all = ['الكل', ...batches];
    chipsEl.innerHTML = all.map(b =>
      `<button class="pill${b === currentBatch ? ' active' : ''}" data-batch="${b}">${b}</button>`
    ).join('');
    chipsEl.querySelectorAll('.pill').forEach(btn => {
      btn.addEventListener('click', () => {
        currentBatch = btn.dataset.batch;
        renderChips();
        render();
      });
    });
  }

  // ----- تحليلاتي (My Analytics) -----
  // Looks up one user's own daily pattern by Telegram @username, no login —
  // same no-auth philosophy as the rest of the site (which already shows
  // everyone's name + minutes on the public leaderboard above). Answered
  // over the same live WebSocket connection used for leaderboard updates
  // (see connectLiveUpdates below): the browser sends a small request and
  // the bot answers it directly, privately, instead of this riding on the
  // broadcast leaderboard payload or the static data.json (which is
  // committed to the public repo — see CLAUDE.md security notes).
  document.getElementById('maToggleBtn').addEventListener('click', () => {
    const sec = document.getElementById('myAnalyticsSection');
    sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
  });

  function submitMyAnalytics() {
    const input = document.getElementById('maUsernameInput');
    const resultEl = document.getElementById('maResult');
    const username = input.value.trim();
    if (!username) {
      resultEl.innerHTML = '<p class="empty">اكتب يوزرك بتيليجرام أول.</p>';
      return;
    }
    if (!window.__liveSocket || window.__liveSocket.readyState !== WebSocket.OPEN) {
      resultEl.innerHTML = '<p class="empty">الاتصال المباشر غير متوفر حاليًا — جرب تحدّث الصفحة بعد شوي.</p>';
      return;
    }
    resultEl.innerHTML = '<p class="empty">جاري البحث...</p>';
    window.__liveSocket.send(JSON.stringify({ type: 'personal_analytics', username }));
  }

  document.getElementById('maSubmitBtn').addEventListener('click', submitMyAnalytics);
  document.getElementById('maUsernameInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitMyAnalytics();
  });

  // Arabic month names, used instead of the raw ISO "YYYY-MM-DD" string:
  // a dash-separated numeric date inside RTL text visually reorders its
  // groups (the known Arabic/RTL bidi bug from CLAUDE.md — "2026-09-25"
  // renders as "25-09-2026") — formatting it as "25 سبتمبر" sidesteps the
  // bug entirely instead of patching it with directional marks.
  const AR_MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
  function formatArabicDate(isoDate) {
    const [, m, day] = isoDate.split('-').map(Number);
    return `${day} ${AR_MONTHS[m - 1]}`;
  }

  function renderMiniLineChart(series) {
    const w = 640, h = 150, pad = 8;
    const maxMin = Math.max(...series.map(p => p.minutes), 1);
    const stepX = series.length > 1 ? (w - pad * 2) / (series.length - 1) : 0;
    const points = series.map((p, i) => {
      const x = pad + i * stepX;
      const y = h - pad - (p.minutes / maxMin) * (h - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    const linePoints = points.join(' ');
    const areaPoints = `${pad},${h - pad} ${linePoints} ${(w - pad).toFixed(1)},${h - pad}`;
    return `
      <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <defs>
          <linearGradient id="maGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3eeeb8" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#3eeeb8" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <polygon points="${areaPoints}" fill="url(#maGrad)"/>
        <polyline points="${linePoints}" fill="none" stroke="#3eeeb8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    `;
  }

  // GitHub-contributions-style heatmap: `series` arrives from the backend
  // already Sunday-aligned (heatmap_series()), so it can just be sliced
  // into 7-day chunks here — each chunk is one column/week, each entry in
  // it one day (Sun..Sat top-to-bottom). Color intensity is scaled to this
  // user's OWN max day, not some fixed global scale, so someone with a
  // lighter routine still sees visible contrast instead of one flat shade.
  function renderHeatmap(series) {
    if (!series.length) return '';
    const maxMin = Math.max(...series.map(p => p.minutes), 1);
    const weeks = [];
    for (let i = 0; i < series.length; i += 7) weeks.push(series.slice(i, i + 7));
    const cols = weeks.map(week => {
      const cells = week.map(p => {
        const opacity = p.minutes === 0 ? 0.08 : (0.25 + 0.75 * Math.min(1, p.minutes / maxMin)).toFixed(2);
        return `<div class="ma-heat-cell" style="opacity:${opacity}" title="${p.date} — ${p.minutes} د"></div>`;
      }).join('');
      return `<div class="ma-heat-col">${cells}</div>`;
    }).join('');
    return `<div class="ma-heat-wrap"><div class="ma-heat-grid">${cols}</div></div>`;
  }

  function renderMyAnalyticsResult(msg) {
    const resultEl = document.getElementById('maResult');
    if (!msg.found) {
      resultEl.innerHTML = '<p class="empty">ما لقيت حساب مسجّل بهذا اليوزر. تأكد من كتابته صح، أو إنك مسجّل بالبوت أصلًا (/register).</p>';
      return;
    }
    const d = msg.data;
    const series = d.daily_series || [];
    const hasAnyActivity = series.some(p => p.minutes > 0);
    const heatmap = d.heatmap || [];
    const hasHeatmapActivity = heatmap.some(p => p.minutes > 0);

    const heatmapHtml = hasHeatmapActivity
      ? `${renderHeatmap(heatmap)}<p class="ma-chart-caption">كل مربع = يوم، كل عمود = أسبوع — آخر ${Math.round(heatmap.length / 7)} أسبوع</p>`
      : '';

    const chartHtml = hasAnyActivity
      ? `<div class="ma-chart">${renderMiniLineChart(series)}</div><p class="ma-chart-caption">الدقائق اليومية — آخر 30 يوم</p>`
      : '<p class="empty">ما فيه جلسات مسجّلة آخر 30 يوم.</p>';

    const bestLine = d.best_day
      ? `<div class="ma-stat"><span>🏆 أفضل يوم</span><b>${d.best_day.weekday} (${formatArabicDate(d.best_day.date)}) — ${d.best_day.minutes} د</b></div>`
      : '';
    const worstLine = d.worst_day
      ? `<div class="ma-stat"><span>📉 أضعف يوم</span><b>${d.worst_day.weekday} (${formatArabicDate(d.worst_day.date)}) — ${d.worst_day.minutes} د</b></div>`
      : '';

    let wowLine;
    if (d.last_week_minutes === 0) {
      wowLine = d.this_week_minutes > 0
        ? '<div class="ma-stat"><span>🆕 هذا أول أسبوع نشط لك</span><b>استمر!</b></div>'
        : '<div class="ma-stat"><span>لا نشاط مسجّل آخر أسبوعين</span></div>';
    } else {
      const pct = d.week_over_week_pct;
      const arrow = pct > 0 ? '📈' : (pct < 0 ? '📉' : '➖');
      // ‎ (LRM): a signed number like "-67%" is an LTR-ish token sitting
      // inside RTL text — without this it visually reorders to "67%-" (same
      // bidi bug as the dates above; see CLAUDE.md gotcha #5).
      wowLine = `<div class="ma-stat"><span>${arrow} هذا الأسبوع مقارنة باللي فات</span><b>‎${pct > 0 ? '+' : ''}${pct}%</b></div>`;
    }

    const tod = d.time_of_day;
    const todLine = tod
      ? `<div class="ma-stat"><span>⏰ أكثر وقت تذاكر فيه</span><b>${tod.top} (${tod.top_pct}%)</b></div>`
      : '<p class="empty">ما عندك جلسات كفاية بعد لمعرفة وقتك المفضّل بالمذاكرة.</p>';

    resultEl.innerHTML = `
      <p class="ma-name">‎${d.name}${d.batch ? `<span class="row-batch">${d.batch}</span>` : ''}</p>
      ${heatmapHtml}
      ${chartHtml}
      ${bestLine}
      ${worstLine}
      ${wowLine}
      ${todLine}
    `;
  }

  document.getElementById('tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.pill');
    if (!btn) return;
    document.querySelectorAll('#tabs .pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    currentPeriod = btn.dataset.period;
    render();
  });

  fetch('./data.json?_=' + Date.now())
    .then(r => r.json())
    .then(json => {
      DATA = json;
      renderChips();
      render();
    })
    .catch(() => {
      document.getElementById('list').innerHTML =
        '<p class="empty">تعذّر تحميل البيانات — تأكد أن البوت يعمل ويحدّث data.json</p>';
    });

  // ----- Live updates over WebSocket -----
  // Set this to your Railway app's public URL with wss:// once deployed,
  // e.g. 'wss://kau-forest-bot-production.up.railway.app'. Left as a
  // placeholder for now, so the site just runs on the static data.json
  // (refreshed on page load) until this is filled in — nothing breaks
  // either way, this only adds the live layer on top.
  const WS_URL = 'wss://kau-forest-bot-production.up.railway.app';

  function refreshAllViews() {
    renderChips();
    render();
    renderLeaderBanner();
    renderForest();
    renderSpotlight();
    renderStreaks();
    flashLiveIndicator();
  }

  function flashLiveIndicator() {
    const el = document.getElementById('updated');
    if (!el) return;
    el.classList.remove('live-flash');
    void el.offsetWidth; // restart the animation
    el.classList.add('live-flash');
  }

  function connectLiveUpdates(retryDelay = 1000) {
    if (!WS_URL || WS_URL.includes('YOUR-RAILWAY-APP')) return; // not configured yet
    let ws;
    try {
      ws = new WebSocket(WS_URL);
    } catch (e) {
      return;
    }
    window.__liveSocket = ws;
    ws.onopen = () => { window.__liveConnected = true; };
    ws.onmessage = (event) => {
      let msg;
      try {
        msg = JSON.parse(event.data);
      } catch (e) {
        return; // ignore malformed frame
      }
      // The leaderboard broadcast is a plain data object; a personal-analytics
      // reply (see submitMyAnalytics above) is tagged so it never gets
      // mistaken for a full leaderboard refresh (and vice versa).
      if (msg && msg.type === 'personal_analytics') {
        renderMyAnalyticsResult(msg);
        return;
      }
      DATA = msg;
      refreshAllViews();
    };
    ws.onclose = () => {
      window.__liveConnected = false;
      if (window.__liveSocket === ws) window.__liveSocket = null;
      // Reconnect with capped exponential backoff — survives Railway
      // restarts/deploys without the page needing a manual refresh.
      setTimeout(() => connectLiveUpdates(Math.min(retryDelay * 1.6, 30000)), retryDelay);
    };
    ws.onerror = () => ws.close();
  }
  connectLiveUpdates();
</script>
</body>
</html>
